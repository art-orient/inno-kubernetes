apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: inno-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: artorient/payment-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongo:27017/payment_db"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "payment-kafka:9092"
            - name: APP_EXTERNAL_API_RANDOM_NUMBER_BASE_URL
              value: "https://www.random.org"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 50
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 50
            periodSeconds: 15
            failureThreshold: 3